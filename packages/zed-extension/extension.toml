id = "claudex"
name = "Claudex"
version = "0.1.0"
schema_version = 1
authors = ["Claudex contributors"]
description = "Claudex Agent Server Extension for Zed"
repository = "https://github.com/claudex-cli/claudex"

[agent_servers.claudex]
name = "Claudex"
icon = "claudex.svg"

[agent_servers.claudex.targets.darwin-aarch64]
archive = "https://registry.npmjs.org/@claudex/cli/-/cli-0.1.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.claudex.targets.darwin-x86_64]
archive = "https://registry.npmjs.org/@claudex/cli/-/cli-0.1.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.claudex.targets.linux-x86_64]
archive = "https://registry.npmjs.org/@claudex/cli/-/cli-0.1.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.claudex.targets.windows-x86_64]
archive = "https://registry.npmjs.org/@claudex/cli/-/cli-0.1.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]
